<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#051c24" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="25" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
  </defs>

  <!-- Fond Noir OLED -->
  <rect width="512" height="512" rx="100" fill="#000000" stroke="#00f0ff" stroke-width="6" />
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Anneau radar extérieur -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="14 10" opacity="0.4" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.25" />

  <!-- Flèche Directionnelle Moto Néon (Cyan & Magenta) -->
  <g filter="url(#neonGlow)">
    <!-- Trace arrière Magenta -->
    <path d="M 256 340 L 256 420" stroke="url(#neonMagenta)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Flèche principale de navigation -->
    <polygon points="256,90 375,370 256,310 137,370" fill="url(#neonCyan)" stroke="#ffffff" stroke-width="4" />
    
    <!-- Point central / cockpit -->
    <circle cx="256" cy="250" r="14" fill="#ffffff" />
  </g>
</svg>
